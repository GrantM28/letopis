name: Docker image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  # write: the rebuilt sprite atlas is committed back (fork)
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # fork: when a sprite sheet (art/sheets) or the sprite tools change, cut the sheets and pack the atlas again,
      # build the image with it, and commit the new atlas back so the repository stays in step
      - name: Did the sprite sheets change?
        id: sprites
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only HEAD~1 HEAD -- art/sheets tools || true)
          else
            changed=$(git diff --name-only "$before" HEAD -- art/sheets tools || true)
          fi
          echo "$changed"
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.sprites.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild the sprite atlas
        if: steps.sprites.outputs.changed == 'true'
        run: |
          pip install --quiet pillow numpy
          python3 -I tools/slice_sprites.py
          python3 -I tools/build_atlas.py
      - name: Commit the rebuilt atlas
        if: steps.sprites.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/cut public/sprites
          if git diff --cached --quiet; then echo "atlas unchanged"; exit 0; fi
          git commit -m "Rebuild the sprite atlas from art/sheets [skip ci]"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LETOPIS_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
