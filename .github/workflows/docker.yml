name: Docker image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

permissions:
  # write: the rebuilt sprite atlas is committed back (fork)
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # fork: when a sprite sheet (art/sheets) or the sprite tools change, cut the sheets and pack the atlas again,
      # build the image with it, and commit the new atlas back so the repository stays in step
      - name: Did the sprite sheets change?
        id: sprites
        run: |
          # anything in the sheets or the tools newer than the last atlas: so an upload missed by a run is caught by the next
          last=$(git log -1 --format=%H -- public/sprites/atlas.json)
          changed=$(git diff --name-only "$last" HEAD -- art/sheets tools || true)
          echo "$changed"
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.sprites.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild the sprite atlas
        if: steps.sprites.outputs.changed == 'true'
        run: |
          pip install --quiet pillow numpy
          python3 -I tools/slice_sprites.py
          python3 -I tools/build_atlas.py
      - name: Commit the rebuilt atlas
        continue-on-error: true
        if: steps.sprites.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/cut public/sprites
          if git diff --cached --quiet; then echo "atlas unchanged"; exit 0; fi
          git commit -m "Rebuild the sprite atlas from art/sheets [skip ci]"
          # a sheet uploaded meanwhile moves main on: take it and try again (its own run rebuilds the atlas with it)
          for try in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort; echo "atlas left for the next run"; exit 0; }
          done
          echo "could not push the atlas; the next run will"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # fork: nothing may show in Bulgarian
      - run: npm run check:english
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LETOPIS_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
