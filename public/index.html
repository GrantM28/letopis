<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>Letopis</title>
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- icons, drawn once and reused with <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-tour" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-night" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-kids" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M9.5 15.5c1.4 1.2 3.6 1.2 5 0"/><path d="M9.5 11.5h.01M14.5 11.5h.01"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13v2"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
      <symbol id="i-fast" viewBox="0 0 24 24"><path d="M3 6l9 6-9 6zM12 6l9 6-9 6z"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/></symbol>
    </defs>
  </svg>

  <div id="stage"></div>
  <div id="loading">The world is waking up…</div>

  <header class="top">
    <div class="brand">Letopis <span id="conn" class="conn off" title="Connection to the server"></span><small id="build" class="build"></small></div>
    <div class="time">
      <div class="year" id="year">…</div>
      <div class="sub"><span id="month"></span> · <span id="era"></span></div>
      <div class="tick"><i id="tickBar"></i></div>
      <div class="clock" role="group" aria-label="Speed of time">
        <button id="clockPause" class="cbtn" title="Pause (Space)" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
        <button id="clockPlay" class="cbtn" title="Normal speed (Space)" aria-label="Normal speed"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="clockFast" class="cbtn" title="Faster: each click speeds time up more" aria-label="Fast forward"><svg class="ic"><use href="#i-fast"/></svg></button>
        <span id="clockLabel" class="clock-label">1×</span>
      </div>
    </div>
    <div class="age-prog" id="ageProg" title="">
      <div class="age-line"><span id="ageLabel">Discoveries of this age</span><b id="ageCount">0/0</b></div>
      <div class="meter"><i id="ageBar"></i></div>
      <div class="age-next" id="ageNext"></div>
    </div>
    <div class="stats">
      <div><span>People</span><b id="pop">0</b></div>
      <div><span>Clans</span><b id="bandsCount">0</b></div>
      <div class="wide"><span>Born</span><b id="born">0</b></div>
      <div class="wide"><span>Died</span><b id="died">0</b></div>
      <div class="wide" title="Real time since this world began"><span>Running for</span><b id="age">0</b></div>
    </div>
  </header>

  <aside class="side">
    <button id="sideHandle" class="side-handle" title="Hide or show the panel" aria-label="Hide or show the panel"><span>›</span></button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="chronicle" title="Chronicle"><svg class="ic"><use href="#i-book"/></svg><span class="lbl">Chronicle</span></button>
      <button class="tab" role="tab" data-tab="discoveries" title="Discoveries"><svg class="ic"><use href="#i-bulb"/></svg><span class="lbl">Discoveries</span></button>
      <button class="tab" role="tab" data-tab="bands" title="Clans"><svg class="ic"><use href="#i-flag"/></svg><span class="lbl">Clans</span></button>
      <button class="tab" role="tab" data-tab="heroes" title="People"><svg class="ic"><use href="#i-person"/></svg><span class="lbl">People</span></button>
      <button class="tab" role="tab" data-tab="stats" title="Statistics"><svg class="ic"><use href="#i-chart"/></svg><span class="lbl">Stats</span></button>
      <button class="tab" role="tab" data-tab="secrets" title="Secrets"><svg class="ic"><use href="#i-star"/></svg><span class="lbl">Secrets</span></button>
    </nav>
    <div id="sideBody" class="side-body"></div>
  </aside>

  <div id="minimapBox" class="minimap" title="The world: click to go there"><canvas id="minimap"></canvas></div>

  <div class="controls">
    <div class="dock">
      <button id="zoomOut" class="btn icon" title="Zoom out" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button id="zoomIn" class="btn icon" title="Zoom in" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button id="homeBtn" class="btn icon" title="Show all the clans" aria-label="Show all the clans"><svg class="ic"><use href="#i-home"/></svg></button>
      <button id="mapBtn" class="btn icon" aria-pressed="true" title="Show or hide the world map" aria-label="Show or hide the world map"><svg class="ic"><use href="#i-map"/></svg></button>
    </div>
    <div class="dock">
      <button id="actsBtn" class="btn help" title="Lend the world a hand: a blessing, rain or a feast"><svg class="ic"><use href="#i-spark"/></svg><span class="lbl">Help</span></button>
      <button id="tourBtn" class="btn" aria-pressed="false" title="The camera wanders the world on its own"><svg class="ic"><use href="#i-tour"/></svg><span class="lbl">Tour</span></button>
      <button id="nightBtn" class="btn" aria-pressed="true" title="Day and night cycle"><svg class="ic"><use href="#i-night"/></svg><span class="lbl">Night</span></button>
      <button id="kidsBtn" class="btn" aria-pressed="false" title="Bigger letters and explanations for children"><svg class="ic"><use href="#i-kids"/></svg><span class="lbl">Kids mode</span></button>
      <button id="sideToggle" class="btn" title="Hide or show the chronicle"><svg class="ic"><use href="#i-panel"/></svg><span class="lbl">Panel</span></button>
    </div>
  </div>

  <div id="toasts"></div>

  <div id="card" class="card" hidden>
    <button id="cardClose" class="btn round close" title="Close">×</button>
    <div id="cardBody"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
