<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1424">
  <title>Летопис</title>
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- icons, drawn once and reused with <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-tour" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-night" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-kids" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M9.5 15.5c1.4 1.2 3.6 1.2 5 0"/><path d="M9.5 11.5h.01M14.5 11.5h.01"/></symbol>
      <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21a2 2 0 0 1 2-2h13v2"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    </defs>
  </svg>

  <div id="stage"></div>
  <div id="loading">Светът се събужда…</div>

  <header class="top">
    <div class="brand">Летопис <span id="conn" class="conn off" title="Връзка със сървъра"></span><small id="build" class="build"></small></div>
    <div class="time">
      <div class="year" id="year">…</div>
      <div class="sub"><span id="month"></span> · <span id="era"></span></div>
      <div class="tick"><i id="tickBar"></i></div>
    </div>
    <div class="age-prog" id="ageProg" title="">
      <div class="age-line"><span id="ageLabel">Открития на епохата</span><b id="ageCount">0/0</b></div>
      <div class="meter"><i id="ageBar"></i></div>
      <div class="age-next" id="ageNext"></div>
    </div>
    <div class="stats">
      <div><span>Хора</span><b id="pop">0</b></div>
      <div><span>Родове</span><b id="bandsCount">0</b></div>
      <div class="wide"><span>Родени</span><b id="born">0</b></div>
      <div class="wide"><span>Починали</span><b id="died">0</b></div>
      <div class="wide"><span>Светът живее</span><b id="age">0</b></div>
    </div>
  </header>

  <aside class="side">
    <button id="sideHandle" class="side-handle" title="Скрий или покажи панела" aria-label="Скрий или покажи панела"><span>›</span></button>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="chronicle" title="Летопис"><svg class="ic"><use href="#i-book"/></svg><span class="lbl">Летопис</span></button>
      <button class="tab" role="tab" data-tab="discoveries" title="Открития"><svg class="ic"><use href="#i-bulb"/></svg><span class="lbl">Открития</span></button>
      <button class="tab" role="tab" data-tab="bands" title="Родове"><svg class="ic"><use href="#i-flag"/></svg><span class="lbl">Родове</span></button>
      <button class="tab" role="tab" data-tab="heroes" title="Личности"><svg class="ic"><use href="#i-person"/></svg><span class="lbl">Личности</span></button>
      <button class="tab" role="tab" data-tab="stats" title="Статистика"><svg class="ic"><use href="#i-chart"/></svg><span class="lbl">Статистика</span></button>
      <button class="tab" role="tab" data-tab="secrets" title="Тайни"><svg class="ic"><use href="#i-star"/></svg><span class="lbl">Тайни</span></button>
    </nav>
    <div id="sideBody" class="side-body"></div>
  </aside>

  <div class="controls">
    <div class="dock">
      <button id="zoomOut" class="btn icon" title="Отдалечи" aria-label="Отдалечи"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button id="zoomIn" class="btn icon" title="Приближи" aria-label="Приближи"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button id="homeBtn" class="btn icon" title="Покажи всички родове" aria-label="Покажи всички родове"><svg class="ic"><use href="#i-home"/></svg></button>
    </div>
    <div class="dock">
      <button id="tourBtn" class="btn" aria-pressed="false" title="Камерата сама обикаля света"><svg class="ic"><use href="#i-tour"/></svg><span class="lbl">Разходка</span></button>
      <button id="nightBtn" class="btn" aria-pressed="true" title="Смяна на ден и нощ"><svg class="ic"><use href="#i-night"/></svg><span class="lbl">Нощ</span></button>
      <button id="kidsBtn" class="btn" aria-pressed="false" title="По-едри букви и детски обяснения"><svg class="ic"><use href="#i-kids"/></svg><span class="lbl">Детски режим</span></button>
      <button id="sideToggle" class="btn" title="Скрий или покажи летописа"><svg class="ic"><use href="#i-panel"/></svg><span class="lbl">Панел</span></button>
      <button id="langBtn" class="btn lang" title="Език / Language">EN</button>
    </div>
  </div>

  <div id="toasts"></div>

  <div id="card" class="card" hidden>
    <button id="cardClose" class="btn round close" title="Затвори">×</button>
    <div id="cardBody"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
